name: Spread (manual - large/flaky)
on:
  pull_request:
    # The 3 default types + "labeled"
    types: [labeled, opened, reopened, synchronize]
  schedule:
    # At 03:00 on Wednesday and Sunday.
    - cron: "0 3 * * WED,SUN"
  workflow_dispatch:

jobs:
  # Decide if the tests should be ran
  predicate:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.eval.outputs.should_run }}
    steps:
      - id: eval
        run: |
          # OR's the three different conditions in which this should run:
          # - This is an actual scheduled run
          # - This is a manually triggered run via the Actions tab
          # - This is a PR with the 'PR: Run Manual Spread' label
          should_run=${{ contains(github.event.pull_request.labels.*.name, 'PR: Run Manual Spread') || contains(fromJSON('["schedule", "workflow_dispatch"]'), github.event_name) }}
          echo "should_run=$should_run" >> "$GITHUB_OUTPUT"

  snap-build:
    needs: predicate
    if: needs.predicate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # speed up build times by using wheels, when available
      - name: Use wheels
        run: |
          yq e 'del(.parts.snapcraft."build-environment"[] | select(.UV_NO_BINARY == "true"))' -i snap/snapcraft.yaml
      - name: Build snap
        uses: canonical/action-build@v1
        id: snapcraft
      - name: Upload snap artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: snap
          path: ${{ steps.snapcraft.outputs.snap }}
      - name: Verify snapcraft snap
        run: |
          sudo snap install --dangerous --classic ${{ steps.snapcraft.outputs.snap }}

  kernel-plugins:
    needs: [predicate, snap-build]
    if: needs.predicate.outputs.should_run == 'true'
    runs-on: [self-hosted, spread-enabled]
    steps:
      - name: Cleanup job workspace
        run: |
          rm -rf "${{ github.workspace }}"
          mkdir "${{ github.workspace }}"
      - name: Checkout snapcraft
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: true
      - name: Download snap artifact
        uses: actions/download-artifact@v8
        with:
          name: snap
          path: tests
      - name: Kernel plugin test
        uses: canonical/starflow/run-spread@main
        with:
          args: >-
            openstack:ubuntu-22.04-64:tests/spread/plugins/craft-parts/kernel
            openstack:ubuntu-22.04-64:tests/spread/plugins/craft-parts/kernel-bin
            openstack:ubuntu-22.04-64:tests/spread/plugins/craft-parts/kernel-cross
            openstack:ubuntu-22.04-64:tests/spread/plugins/craft-parts/kernel-deb
          junit-name: kernel-plugins

  initrd-plugins:
    needs: [predicate, snap-build]
    if: needs.predicate.outputs.should_run == 'true'
    runs-on: [self-hosted, spread-enabled]
    steps:
      - name: Cleanup job workspace
        run: |
          rm -rf "${{ github.workspace }}"
          mkdir "${{ github.workspace }}"
      - name: Checkout snapcraft
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: true
      - name: Download snap artifact
        uses: actions/download-artifact@v8
        with:
          name: snap
          path: tests
      - name: Initrd plugin test
        uses: canonical/starflow/run-spread@main
        with:
          args: openstack:ubuntu-22.04-64:tests/spread/plugins/craft-parts/initrd
          junit-name: initrd-plugins

      - name: Discard spread workers
        if: always()
        run: |
          shopt -s nullglob
          for r in .spread-reuse.*.yaml; do
            spread -discard -reuse-pid="$(echo "$r" | grep -o -E '[0-9]+')"
          done

  remote-build:
    needs: [predicate, snap-build]
    if: needs.predicate.outputs.should_run == 'true'
    runs-on: [self-hosted, spread-enabled]
    steps:
      - name: Cleanup job workspace
        run: |
          rm -rf "${{ github.workspace }}"
          mkdir "${{ github.workspace }}"
      - name: Checkout snapcraft
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: true
      - name: Download snap artifact
        uses: actions/download-artifact@v8
        with:
          name: snap
          path: tests
      - name: remote-build test
        uses: canonical/starflow/run-spread@main
        env:
          LAUNCHPAD_TOKEN: "${{ secrets.LAUNCHPAD_TOKEN }}"
        with:
          args: >-
            openstack:ubuntu-22.04-64:tests/spread/core22/remote-build
            openstack:ubuntu-24.04-64:tests/spread/core24/remote-build
          junit-name: remote-build

      - name: Discard spread workers
        if: always()
        run: |
          shopt -s nullglob
          for r in .spread-reuse.*.yaml; do
            spread -discard -reuse-pid="$(echo "$r" | grep -o -E '[0-9]+')"
          done

  colcon-plugins:
    needs: [predicate, snap-build]
    if: needs.predicate.outputs.should_run == 'true'
    runs-on: [self-hosted, spread-enabled]
    steps:
      - name: Cleanup job workspace
        run: |
          rm -rf "${{ github.workspace }}"
          mkdir "${{ github.workspace }}"
      - name: Checkout snapcraft
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: true
      - name: Download snap artifact
        uses: actions/download-artifact@v8
        with:
          name: snap
          path: tests
      - name: colcon plugin test
        uses: canonical/starflow/run-spread@main
        with:
          args: >-
            openstack:ubuntu-22.04-64:tests/spread/core24-suites/plugins/colcon-hello
            openstack:ubuntu-22.04-64:tests/spread/core24-suites/plugins/colcon-msg-package
            openstack:ubuntu-22.04-64:tests/spread/core24-suites/plugins/colcon-packages-ignore
            openstack:ubuntu-22.04-64:tests/spread/core24-suites/plugins/colcon-talker-listener
            openstack:ubuntu-22.04-64:tests/spread/plugins/craft-parts/colcon-hello
          junit-name: colcon-plugins

      - name: Discard spread workers
        if: always()
        run: |
          shopt -s nullglob
          for r in .spread-reuse.*.yaml; do
            spread -discard -reuse-pid="$(echo "$r" | grep -o -E '[0-9]+')"
          done

  extensions:
    needs: [predicate, snap-build]
    if: needs.predicate.outputs.should_run == 'true'
    runs-on: [self-hosted, spread-enabled]
    steps:
      - name: Cleanup job workspace
        run: |
          rm -rf "${{ github.workspace }}"
          mkdir "${{ github.workspace }}"
      - name: Checkout snapcraft
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: true
      - name: Download snap artifact
        uses: actions/download-artifact@v8
        with:
          name: snap
          path: tests
      - name: extensions test
        uses: canonical/starflow/run-spread@main
        with:
          args: openstack.*:tests/spread/extensions/
          junit-name: extensions

      - name: Discard spread workers
        if: always()
        run: |
          shopt -s nullglob
          for r in .spread-reuse.*.yaml; do
            spread -discard -reuse-pid="$(echo "$r" | grep -o -E '[0-9]+')"
          done

  snapd-bases:
    needs: [predicate, snap-build]
    if: needs.predicate.outputs.should_run == 'true'
    runs-on: [self-hosted, spread-enabled]
    steps:
      - name: Cleanup job workspace
        run: |
          rm -rf "${{ github.workspace }}"
          mkdir "${{ github.workspace }}"
      - name: Checkout snapcraft
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: true
      - name: Download snap artifact
        uses: actions/download-artifact@v8
        with:
          name: snap
          path: tests
      - name: Spread test
        uses: canonical/starflow/run-spread@main
        with:
          args: openstack:ubuntu-22.04-64:tests/spread/snaps/snapd
          junit-name: snapd-bases

      - name: Discard spread workers
        if: always()
        run: |
          shopt -s nullglob
          for r in .spread-reuse.*.yaml; do
            spread -discard -reuse-pid="$(echo "$r" | grep -o -E '[0-9]+')"
          done

  squid-proxy:
    needs: [predicate, snap-build]
    if: needs.predicate.outputs.should_run == 'true'
    runs-on: [self-hosted, spread-enabled]
    steps:
      - name: Clean up job workspace
        run: |
          rm -rf "${{ github.workspace }}"
          mkdir "${{ github.workspace }}"
      - name: Checkout Snapcraft
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: true
      - name: Download snap artifact
        uses: actions/download-artifact@v8
        with:
          name: snap
          path: tests
      - name: Spread test
        uses: canonical/starflow/run-spread@main
        with:
          args: >-
            openstack:ubuntu-24.04-64:tests/spread/core24/squid-proxy
            openstack:ubuntu-22.04-64:tests/spread/core22/squid-proxy
          junit-name: squid-proxy

      - name: Discard spread workers
        if: always()
        run: |
          shopt -s nullglob
          for r in .spread-reuse.*.yaml; do
            spread -discard -reuse-pid="$(echo "$r" | grep -o -E '[0-9]+')"
          done
