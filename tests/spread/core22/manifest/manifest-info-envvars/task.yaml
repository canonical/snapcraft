summary: Test manifest file creation

restore: |
  # The regular clean can potentially fail depending on if/when the test itself failed, but
  # they should always both be attempted
  snapcraft clean || true
  snapcraft clean --destructive-mode
  rm -f ./*.snap

execute: |
  #shellcheck source=tests/spread/tools/review.sh
  . "$TOOLS_DIR/review.sh"

  export SNAPCRAFT_BUILD_INFO=1
  export SNAPCRAFT_IMAGE_INFO='{"test-var": "value"}'
  snapcraft pack --use-lxd

  unsquashfs manifest_0.1_*.snap
  grep '^  test-var: value' squashfs-root/snap/manifest.yaml
  rm -Rf squashfs-root

  review manifest_0.1_*.snap

  # also test in destructive mode
  snapcraft pack --destructive-mode

  grep '^  test-var: value' prime/snap/manifest.yaml

  review manifest_0.1_*.snap
