summary: Test manifest file creation

prepare: |
  #shellcheck source=tests/spread/tools/snapcraft-yaml.sh
  . "$TOOLS_DIR/snapcraft-yaml.sh"
  set_base "snap/snapcraft.yaml"

execute: |
  #shellcheck source=tests/spread/tools/review.sh
  . "$TOOLS_DIR/review.sh"

  export SNAPCRAFT_BUILD_INFO=1
  export SNAPCRAFT_IMAGE_INFO='{"test-var": "value"}'

  snapcraft pack

  unsquashfs manifest_0.1_*.snap
  grep '^  test-var: value' squashfs-root/snap/manifest.yaml
  rm -Rf squashfs-root

  review manifest_0.1_*.snap

restore: |
  snapcraft clean
  rm -f ./*.snap

  #shellcheck source=tests/spread/tools/snapcraft-yaml.sh
  . "$TOOLS_DIR/snapcraft-yaml.sh"
  restore_yaml "snap/snapcraft.yaml"
