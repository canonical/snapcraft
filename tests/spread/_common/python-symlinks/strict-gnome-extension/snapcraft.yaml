name: strict-gnome-extension
version: "1.0"
summary: Strict with gnome extension
description: |
  Using the gnome extension must not affect the python
  interpreter symlink. With strict confinement, the expected
  symlink for base core26 is python3 -> /usr/bin/python3.14.

grade: devel
base: core26
confinement: strict

apps:
  hello:
    command: bin/hello
    extensions: [gnome]

parts:
  python-sample:
    plugin: python
    source: src
    python-packages: [black]
    stage-packages:
      - libpython3.14-minimal
      - libpython3.14-stdlib
      - python3-minimal # for the "python3" symlink
      - python3.14-minimal
      - python3.14-venv
