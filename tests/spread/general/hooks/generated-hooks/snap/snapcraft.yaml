name: generated-hooks
base: core22
version: '1.0'
summary: Test generated hooks.
description: Code generated hooks should replace placeholder stubs in meta/hooks.
grade: stable
confinement: strict

hooks:
  configure:
    plugs: [network]

parts:
  hooks:
    source: src/
    plugin: make
    build-snaps: [go/1.20/stable]
    override-build: |
      cd $SNAPCRAFT_PART_SRC
      make build
      install -DT configure $SNAPCRAFT_PART_INSTALL/snap/hooks/configure
