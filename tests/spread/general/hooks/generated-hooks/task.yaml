summary: Code generated hooks should replace placeholder stubs in the packed snap.

environment:

prepare: |
  #shellcheck source=tests/spread/tools/snapcraft-yaml.sh
  . "$TOOLS_DIR/snapcraft-yaml.sh"
  set_base "./snap/snapcraft.yaml"

restore: |
  snapcraft clean --destructive-mode
  rm -f ./*.snap

  #shellcheck source=tests/spread/tools/snapcraft-yaml.sh
  . "$TOOLS_DIR/snapcraft-yaml.sh"
  restore_yaml "snap/snapcraft.yaml"

execute: |
  snapcraft pack --destructive-mode

  # verify the built hook remains in snap/hooks
  prime/snap/hooks/configure | MATCH "I am a code generated configure hook!"

  # verify the placeholder stub was replaced in prime/meta/hooks
  prime/meta/hooks/configure | MATCH "I am a code generated configure hook!"
  NOMATCH "/bin/true" < prime/meta/hooks/configure

  snap_file="$(echo generated-hooks_1.0_*.snap)"

  # verify the packed snap also contains the real hook in meta/hooks
  unsquashfs -cat "${snap_file}" meta/hooks/configure | MATCH \
    "I am a code generated configure hook!"
  NOMATCH "/bin/true" < <(unsquashfs -cat "${snap_file}" meta/hooks/configure)

  # verify snap is installable
  snap install generated-hooks_1.0_*.snap --dangerous
